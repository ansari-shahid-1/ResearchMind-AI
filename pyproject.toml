# Tool configuration only - dependencies live in requirements.txt, which is
# what the README and CI both install from.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # chromadb and langchain both emit deprecation noise we cannot act on
    "ignore::DeprecationWarning:chromadb.*",
    "ignore::DeprecationWarning:langchain.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines in prompts and docstrings are fine
    "B008",  # argparse/typer defaults
]
